const TPLS = () => S.documents.filter(d => d.kind === 'tpl').sort((a, b) => (a.title || '').localeCompare(b.title || ''));
const tplHidden = () => (S.settings?.tplHidden || []);
function tplLibrary() {
  const f = S.tplF || 'All', hid = tplHidden(), mine = TPLS();
  const built = Object.entries(W_TPL).filter(([k]) => !hid.includes(k));
  const show = f === 'Mine' ? [] : built.filter(([, v]) => f === 'All' || v[5] === f), mineShow = f === 'All' || f === 'Mine' ? mine : [];
  const card = (key, name, icon, color, desc, years, custom) => `<div class="wr-tpl" style="--sc:${color}"><button class="wr-tpl-use" data-act="wr-new" ${custom ? `data-ctpl="${key}"` : `data-tpl="${key}"`}><span class="st-ic2">${ic(icon, 20)}</span><b>${esc(name)}</b><small>${esc(desc)}</small>${years && years !== '—' ? `<em>Year ${years}</em>` : ''}</button><div class="wr-tpl-tools"><button class="icon-btn sm ghost" data-act="tpl-edit" ${custom ? `data-id="${key}"` : `data-k="${key}"`} title="Edit template">${ic('edit', 14)}</button><button class="icon-btn sm ghost" data-act="tpl-del" ${custom ? `data-id="${key}"` : `data-k="${key}"`} title="${custom ? 'Delete' : 'Hide'} template">${ic('trash', 14)}</button></div></div>`;
  return `<div class="card panel"><div class="panel-h"><div><h3>${ic('sparkle', 18)} Templates</h3><p class="muted">Click one to start a document. ✏️ edits a template; 🗑 removes it.</p></div><div class="acts"><button class="btn btn-sm" data-act="tpl-new">${ic('plus', 15)} New template</button></div></div>
    <div class="chips-row">${['All', ...TPL_CATS, 'Mine'].map(c => `<button class="chipbtn ${f === c ? 'on' : ''}" data-act="tpl-f" data-v="${c}">${c === 'Mine' ? `${ic('star', 13)} My templates` : c} <em>${c === 'All' ? built.length + mine.length : c === 'Mine' ? mine.length : built.filter(([, v]) => v[5] === c).length}</em></button>`).join('')}</div>
    <div class="wr-tpls">${f === 'All' || f === 'Practice' ? `<a class="wr-tpl" style="--sc:#ea580c" href="#/admin/maths/questions"><span class="wr-tpl-use"><span class="st-ic2">${ic('calc', 20)}</span><b>Question worksheet</b><small>Generate maths questions with answers</small><em>Year 7–12</em></span></a>` : ''}${mineShow.map(d => card(d.id, d.title, 'star', '#eab308', 'My template', '', 1)).join('')}${show.map(([k, v]) => card(k, v[0], v[1], v[2], v[3], v[6], 0)).join('')}</div>
    ${hid.length ? `<p class="muted small" style="margin-top:12px">${hid.length} built-in template${hid.length === 1 ? ' is' : 's are'} hidden · <button class="linkbtn" data-act="tpl-restore">Show them again</button></p>` : ''}</div>`;
}

/* ---- admin: list page ---- */
function pgWrite(id) {
  if (id) { const d = S.documents.find(x => x.id === id && (x.kind === 'write' || x.kind === 'tpl')) || (S.wNew?.id === id ? S.wNew : null); return d ? wrEditor(d) : `<div class="card empty"><b>Document not found</b><a class="btn" href="#/admin/write">Back to documents</a></div>`; }
  const all = WRITES(), f = S.wrAF || 'all', list = f === 'all' ? all : all.filter(d => wShow(d) === f);
  const tot = all.reduce((a, d) => a + (d.size || 0), 0);
  return `<div class="page-h"><div><h2>${ic('word', 24)} Documents</h2><p class="muted">Write like in Microsoft Word. Saved as text in your database, so it uses far less space than uploading files${all.length ? ` (${all.length} document${all.length === 1 ? '' : 's'} · ${fmtBig(tot)})` : ''}. Download as Word, PDF or Excel any time.</p></div>
    <div class="acts"><label class="btn" style="cursor:pointer">${ic('upload', 16)} Open a Word file<input type="file" id="wr-import" accept=".docx,.txt,.html,.htm" hidden></label><button class="btn btn-primary" data-act="wr-new" data-tpl="blank">${ic('plus', 16)} New document</button></div></div>
  ${all.length ? `<div class="chips-row">${[['all', 'All'], ...Object.entries(WSHOW).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button class="chipbtn ${f === k ? 'on' : ''}" data-act="wr-af" data-v="${k}">${k !== 'all' ? ic(WSHOW[k][1], 14) : ''} ${l} <em>${k === 'all' ? all.length : all.filter(d => wShow(d) === k).length}</em></button>`).join('')}</div>
  <div class="wr-grid">${list.map(d => wrCard(d, true)).join('') || '<p class="muted">No documents with this setting.</p>'}</div>` : ''}
  ${tplLibrary()}
  <div class="info">${ic('globe', 18)}<div>After writing, choose <b>who can see it</b>: <b>Admin panel only</b> (private, only you can see it), <b>Website only</b> (shown on the public <b>Resources</b> page) or <b>Website + admin panel</b> (both).</div></div>`;
}
function wrCard(d, admin) {
  const sh = WSHOW[wShow(d)], txt = wrText(d.html).slice(0, 150);
  const open = admin ? `href="#/admin/write/${d.id}"` : `data-act="wr-read" data-id="${d.id}"`;
  return `<article class="card wr-card ${admin ? '' : 'reveal'}">
    <a class="wr-thumb" ${open}><div class="wr-mini"><div class="wr-view">${cleanHTML(d.html)}</div></div></a>
    <div class="wr-body">${admin ? `<span class="chip" style="color:${sh[2]};border-color:${sh[2]}44">${ic(sh[1], 13)} ${sh[0]}</span>` : d.category ? `<span class="chip">${esc(d.category)}</span>` : ''}
      <h3><a ${open}>${esc(d.title || 'Untitled document')}</a></h3>${txt ? `<p class="muted">${esc(txt)}${txt.length >= 150 ? '…' : ''}</p>` : ''}
      <small class="muted">${admin && d.category ? `${esc(d.category)} · ` : ''}${d.words || 0} words${admin ? ` · ${fmtBig(d.size || 0)}` : ''} · ${fmtDate(d.updated || d.created)}</small>
      <div class="wr-acts">${admin ? `<a class="btn btn-sm btn-primary" href="#/admin/write/${d.id}">${ic('edit', 15)} Edit</a><button class="icon-btn sm ghost" data-act="wr-read" data-id="${d.id}" title="Read">${ic('eye', 15)}</button><button class="icon-btn sm ghost" data-act="wr-dl" data-id="${d.id}" data-k="docx" title="Download Word">${ic('word', 15)}</button><button class="icon-btn sm ghost" data-act="wr-dl" data-id="${d.id}" data-k="pdf" title="Download PDF">${ic('filetext', 15)}</button><button class="icon-btn sm ghost" data-act="wr-dl" data-id="${d.id}" data-k="xlsx" title="Download Excel">${ic('sheet', 15)}</button><button class="icon-btn sm ghost" data-act="wr-del" data-id="${d.id}" title="Delete">${ic('trash', 15)}</button>`
      : `<button class="btn btn-sm btn-primary" data-act="wr-read" data-id="${d.id}">${ic('eye', 15)} Read</button>${d.dl !== false ? `<button class="btn btn-sm" data-act="wr-dl" data-id="${d.id}" data-k="pdf">${ic('download', 15)} PDF</button><button class="btn btn-sm" data-act="wr-dl" data-id="${d.id}" data-k="docx">${ic('word', 15)} Word</button>` : ''}`}</div></div></article>`;
}

  fsimp: { n: 'Simplifying fractions', s: 'Stage 3–4', g(l) { let n, d; do { d = QR(2, l === 1 ? 6 : 12); n = QR(1, l === 3 ? d * 3 : d - 1); } while (mgcd(n, d) !== 1 || n === d); const k = QR(2, l === 1 ? 5 : 9), N = n * k, D = d * k; return { q: `Simplify ${N}/${D}`, a: l === 3 && n > d ? `${fS(n, d)} = ${fMix(n, d)}` : fS(n, d), w: [`HCF of ${N} and ${D} is ${k}`, `${N} ÷ ${k} = ${n}, ${D} ÷ ${k} = ${d}`, ...(l === 3 && n > d ? [`As a mixed number: ${fMix(n, d)}`] : [])] }; } },

  pfac: { n: 'Prime factorisation', s: 'Stage 4', g(l) { let n; do n = l === 1 ? QR(12, 100) : l === 2 ? QR(100, 500) : QR(500, 5000); while (primeFactors(n).length < (l === 1 ? 2 : 3)); const f = primeFactors(n); let v = n; return { q: `Write ${mfmt(n)} as a product of prime factors`, a: powForm(f), w: f.slice(0, -1).map(p => { const s = `${v} ÷ ${p} = ${v / p}`; v /= p; return s; }) }; } },
  hcf: { n: 'HCF & LCM', s: 'Stage 4', g(l) { const k = QR(2, l === 1 ? 6 : 12), a = k * QR(2, 9), b = k * QR(2, 9); if (a === b) return this.g(l); const H = mgcd(a, b), L = mlcm(a, b); if (l === 1) return { q: `Find the HCF of ${a} and ${b}`, a: mfmt(H), w: [`Factors of ${a} and ${b} — the highest common one is ${H}`] }; if (l === 2) return { q: `Find the LCM of ${a} and ${b}`, a: mfmt(L), w: [`Multiples of ${Math.max(a, b)}: ${[1, 2, 3, 4].map(i => i * Math.max(a, b)).join(', ')}…`, `First one divisible by ${Math.min(a, b)} is ${L}`] }; return { q: `Find the HCF and LCM of ${a} and ${b}`, a: `HCF = ${H}, LCM = ${mfmt(L)}`, w: [`${a} = ${powForm(primeFactors(a))}`, `${b} = ${powForm(primeFactors(b))}`, `HCF = ${H}, LCM = ${a} × ${b} ÷ ${H} = ${mfmt(L)}`] }; } },

const WSDOC = id => S.documents.find(d => d.kind === 'ws' && d.ref === id);

  'st-clean': async () => { const use = fileUsage(), l = S.filesMeta.filter(x => !use[x.id]); const tot = l.reduce((a, x) => a + (x.size || 0), 0); if (!await askConfirm(`Delete ${l.length} unused file${l.length === 1 ? '' : 's'}?`, `These files aren't linked to anything on your site. This frees about ${fmtBig(tot)}.`, 'Delete all')) return; const t = toast('Cleaning up…', '', { sticky: true }); S.stBusy = 1; for (const x of l) await Store.delFile(x.id).catch(() => { }); S.stBusy = 0; t.remove(); S.filesMeta = (S.filesMeta || []).filter(x => use[x.id]); notify('Storage cleaned up', `${l.length} unused file${l.length === 1 ? '' : 's'} deleted · ${fmtBig(tot)} freed`, 'settings', { type: 'page', to: '#/admin/storage' }); route(); },
  'pnav-open': () => { $('#psidebar')?.classList.add('open'); $('.site')?.classList.add('nav-open'); },
  'pnav-close': () => { $('#psidebar')?.classList.remove('open'); $('.site')?.classList.remove('nav-open'); },
  'search-open': () => openSearchModal(),
  'search-all': el => { S.f.q = el.dataset.q || ''; go('#/admin/search'); },
  'hero-pick': () => heroPickModal(),
  'hero-add': el => {
    const g = S.gallery.find(x => x.id === el.dataset.id), H = S.draft.hero;
    if ((H.slides || []).length >= 8) return toast('Up to 8 pictures', 'Remove one before adding another.', { kind: 'error' });
    H.slides = [...(H.slides || []), { fileId: g.fileId, thumb: g.thumb, caption: g.caption || '' }];
    Store.setFilePublic(g.fileId, true); markDirty(el); closeModal(); route(); toast('Picture added', 'Click Save changes to publish it.');
  },
  'theme-default': async () => { const t = curTheme(); try { await saveSettings({ mode: t.mode, preset: t.preset, font: t.font, radius: t.radius, custom: t.custom, sidebar: t.sidebar }); notify('Website look saved', `${t.preset === 'custom' ? 'Custom colours' : PRESETS[t.preset][2]} · ${FONTS[t.font][2]} font · ${MODES[t.mode][0]} mode`, 'settings'); } catch (e) { toast('Save failed', e.message, { kind: 'error' }); } },
  export: () => {
    const data = { exported: new Date().toISOString(), profile: S.profile, sections: S.sections, resources: S.resources, gallery: S.gallery, documents: S.documents, notifications: S.notifications };
    saveBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `portfolio-backup-${new Date().toISOString().slice(0, 10)}.json`); toast('Backup downloaded');
  },

  agalf: el => { S.agalF = el.dataset.v; route(); },
  lb: el => openLightbox(el.dataset.id, el.dataset.scope),
  lbnav: el => { if (!S.lb) return; const n = S.lb.ids.length; S.lb.i = (S.lb.i + +el.dataset.d + n) % n; renderLb(); },
  'gal-edit': el => galForm(S.gallery.find(g => g.id === el.dataset.id)),
  'gal-vis': async el => { const g = S.gallery.find(x => x.id === el.dataset.id); g.visible = g.visible === false; await Store.set('gallery', g.id, g); Store.setFilePublic(g.fileId, g.visible); toast(g.visible ? 'Photo is now visible on your website' : 'Photo hidden from your website'); route(); },
  'gal-del': async el => { const g = S.gallery.find(x => x.id === el.dataset.id); if (!await askConfirm('Delete this photo?', 'It will be removed from your gallery permanently.')) return; await Store.del('gallery', g.id); Store.delFile(g.fileId).catch(() => { }); S.gallery = S.gallery.filter(x => x.id !== g.id); notify('Photo deleted', g.caption || 'Removed from gallery', 'delete', { type: 'page', to: '#/admin/gallery' }); route(); },
  // documents
  'doc-add': () => docForm(),
  'doc-edit': el => docForm(S.documents.find(d => d.id === el.dataset.id)),
  'doc-view': el => { const d = S.documents.find(x => x.id === el.dataset.id); if (d) openViewer({ title: d.title, fileId: d.fileId, name: d.fileName, url: d.fileId ? null : d.url, type: d.type, desc: d.description }); },
  'doc-vis': async el => { const d = S.documents.find(x => x.id === el.dataset.id); d.visible = d.visible === false; await Store.set('documents', d.id, d); if (d.fileId) Store.setFilePublic(d.fileId, d.visible); notify(d.visible ? 'Document is now public' : 'Document hidden', d.title, 'document', { type: 'page', to: '#/admin/documents' }); route(); },
  'doc-del': async el => { const d = S.documents.find(x => x.id === el.dataset.id); if (!await askConfirm(`Delete "${d.title}"?`, 'It will be removed from your website and deleted.')) return; await Store.del('documents', d.id); if (d.fileId) Store.delFile(d.fileId).catch(() => { }); S.documents = S.documents.filter(x => x.id !== d.id); notify('Document deleted', d.title, 'delete', { type: 'page', to: '#/admin/documents' }); route(); }
};

/* ---------- global listeners ---------- */
document.addEventListener('click', e => {
  if (S.ddOpen && !e.target.closest('.bell-wrap')) { S.ddOpen = false; $('#dd')?.classList.remove('open'); }
  if (!e.target.closest('.sbox')) closeSugg();
  if (!e.target.closest('.bell-wrap')) $('#pubdd')?.classList.remove('open');
  const el = e.target.closest('[data-act]');
  if (el?.dataset.sitem !== undefined) { closeSugg(); document.activeElement?.blur?.(); $('.topbar')?.classList.remove('searching'); if (el.closest('#modal-root')) closeModal(); }
  if (el && !el.disabled) { const fn = A[el.dataset.act]; if (fn) return fn(el, e); }
  const a = e.target.closest('a[href^="#/"]');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); }
});
document.addEventListener('keydown', e => {
  const si = e.target.closest?.('.sinput') ? e.target : null;
  if (si) {
    const items = $$('.sitem', si.closest('.sbox'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!items.length) return; SSEL = (SSEL + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach((it, k) => it.classList.toggle('sel', k === SSEL)); items[SSEL].scrollIntoView({ block: 'nearest' }); return; }
    if (e.key === 'Enter') { e.preventDefault(); (items[SSEL] || items[0])?.click(); return; }
    if (e.key === 'Escape') { closeSugg(); si.blur(); return; }
  }
  if (e.key === '/' && S.user && ROUTE.startsWith('#/admin') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !document.activeElement?.isContentEditable && !$('#modal-root').innerHTML) { e.preventDefault(); const t = $('.tb-search .sinput'); if (t && t.offsetParent) t.focus(); else openSearchModal(); return; }
  if (e.key === 'Escape') { if ($('#confirm-root').innerHTML) $('#confirm-root [data-c="0"]')?.click(); else if ($('#modal-root').innerHTML) closeModal(); else if (S.ddOpen) { S.ddOpen = false; $('#dd')?.classList.remove('open'); } }
  if (S.lb && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const n = S.lb.ids.length; S.lb.i = (S.lb.i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; renderLb(); }
  if (e.key === 'Enter' && e.target.matches('.res[data-act=view]')) e.target.click();
});
let pvT;
function onBind(el) {
  const o = tgtObj(el); if (!o) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.lines) v = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  setPath(o, el.dataset.bind, v); markDirty(el);
  if (S.page === 'home') { clearTimeout(pvT); pvT = setTimeout(() => { refreshHeroPrev(); const hp = $('#homeprev'); if (hp) hp.innerHTML = homePreview(S.draft); }, 220); }
  if (S.page === 'cv') { clearTimeout(pvT); pvT = setTimeout(() => { const p = $('#cvprev'); if (p) p.innerHTML = cvHTML(S.draft); }, 200); }
}
let fT, cT;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest?.('.mv-form')) { clearTimeout(S.mvT); S.mvT = setTimeout(() => mvRender(el.closest('.mv-wrap')), 250); }
  if (el.dataset.libq && S.libDraft) { const q = S.libDraft.sections[+el.dataset.s]?.qs[+el.dataset.i]; if (q) { q[el.dataset.libq] = el.dataset.libq === 'w' ? el.value.split('\n') : el.value; libMark(); } }
  if (el.dataset.libs !== undefined && S.libDraft) { S.libDraft.sections[+el.dataset.libs].h = el.value; libMark(); }
  if (el.dataset.libf && S.libDraft && el.tagName !== 'SELECT') { S.libDraft[el.dataset.libf] = el.value; libMark(); }
  if (el.dataset.libQ !== undefined) { S.libQ = el.value; clearTimeout(S.libT); S.libT = setTimeout(async () => { const pos = el.selectionStart; S.live = true; await route(); S.live = false; const n = $('[data-lib-q]'); if (n) { n.focus({ preventScroll: true }); n.setSelectionRange(pos, pos); } }, 300); }
  if (el.dataset.qgf) { const x = S.qgQs[+el.dataset.i]; if (x) { x[el.dataset.qgf] = el.dataset.qgf === 'w' ? el.value.split('\n') : el.value; x.edited = 1; } }
  if (el.dataset.qbf && el.dataset.qbf !== 'year') qbEdit(el.dataset.id, el.dataset.qbf, el.dataset.qbf === 'w' ? el.value.split('\n').filter(s => s.trim()) : el.value);
  if (el.dataset.qg === 'title') { S.qg.title = el.value; clearTimeout(S.qgT); S.qgT = setTimeout(qgRefresh, 250); }
  if (el.dataset.bind) onBind(el);
  if (el.classList?.contains('sinput')) renderSugg(el);
  if (el.dataset.stQ !== undefined) { S.stQ = el.value; clearTimeout(S.stT); S.stT = setTimeout(async () => { const pos = el.selectionStart, y = scrollY; S.live = true; await route(); S.live = false; window.scrollTo(0, y); const n = $('[data-st-q]'); if (n) { n.focus({ preventScroll: true }); n.setSelectionRange(pos, pos); } }, 300); }
  if (el.dataset.filter === 'q') { S.f.q = el.value; clearTimeout(fT); fT = setTimeout(refreshGrid, 120); }
  if (el.dataset.themeCustom) { const t = curTheme(), c = [...t.custom]; c[+el.dataset.themeCustom] = el.value; clearTimeout(cT); cT = setTimeout(() => setTheme({ custom: c }), 60); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest?.('.mv-form') && el.tagName === 'SELECT') mvRender(el.closest('.mv-wrap'));
  if (el.dataset.qg && el.dataset.qg !== 'title') { const k = el.dataset.qg; S.qg[k] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : k === 'level' && el.value === 'ex' ? 'ex' : +el.value; if (k === 'level' || k === 'count') { S.qgQs = qgMake(S.qg); route(); } else qgRefresh(); }
  if (el.dataset.qbf === 'year') { qbEdit(el.dataset.id, 'year', +el.value); }
  if (el.dataset.wso) { const o = wsOpt(); o[el.dataset.wso] = el.type === 'checkbox' ? (el.checked ? 1 : 0) : +el.value; }
  if (el.dataset.libf === 'year' && S.libDraft) { S.libDraft.year = +el.value; libMark(); }
  if (el.id === 'wr-import' && el.files[0]) { wrImport(el.files[0]); el.value = ''; return; }
  if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'color')) { onBind(el); if (el.dataset.rerender) route(); }
  if (el.dataset.catsel) { const w = el.closest('form')?.querySelector('.newcat'); if (w) { w.style.display = el.value === '__new' ? '' : 'none'; if (el.value === '__new') w.querySelector('input').focus(); } }
  if (el.dataset.filter && el.dataset.filter !== 'q') { S.f[el.dataset.filter] = el.value; refreshGrid(); }
  if (el.dataset.upload && el.files.length) { handleUpload(el.dataset.upload, [...el.files], el.dataset.i); el.value = ''; }
  const f = el.form;
  if (f?.id === 'resform' || f?.id === 'docform') {
    if (el.name === 'sectionId') { const s = secById(el.value); $('#subsel').innerHTML = s.subs.map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join(''); }
    if (el.name === 'file' && el.files[0]) { const file = el.files[0]; $('#resfname').textContent = `${file.name} · ${fmtSize(file.size)}`; if (!f.title.value) f.title.value = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '); f.type.value = detectType(file.name, file.type); }
    if (el.name === 'url' && f.id === 'resform') { const t = detectType(el.value.split('?')[0]); f.type.value = t === 'other' ? 'link' : t; }
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'resform') saveResource(f);
  if (f.id === 'docform') saveDoc(f);
  if (f.id === 'loginform') doLogin(f);
  if (f.id === 'gsearch') { S.f.q = f.q.value.trim(); go('#/admin/search'); }
  if (f.id === 'galup') { const files = S.pendingFiles || []; let cat = f.cat.value; try { if (cat === '__new') cat = await ensureCat('gal', f.newcat.value); } catch (x) { $('#reserr').textContent = x.message; return; } closeModal(); S.pendingFiles = null; uploadGallery(files, cat, f.caption.value.trim(), f.visible.checked); }
  if (f.id === 'pwform') changePw(f);
  if (f.id === 'certform') saveCert(f);
  if (f.id === 'certup') { const files = S.pendingFiles || []; let cat = f.cat.value; try { if (cat === '__new') cat = await ensureCat('cert', f.newcat.value); } catch (x) { $('#reserr').textContent = x.message; return; } closeModal(); S.pendingFiles = null; uploadCerts(files, cat, f.issuer.value.trim(), f.date.value, f.visible.checked); }
  if (f.id === 'galform') { let album = f.album.value; if (album === '__new') { try { album = await ensureCat('gal', f.newcat.value); } catch (x) { return toast('Category needed', x.message, { kind: 'error' }); } } const g = S.gallery.find(x => x.id === f.dataset.id); Object.assign(g, { caption: f.caption.value.trim(), album, visible: f.visible.checked }); await Store.set('gallery', g.id, g); Store.setFilePublic(g.fileId, g.visible); closeModal(); notify('Photo updated', g.caption || 'Gallery photo', 'gallery', { type: 'page', to: '#/admin/gallery' }); route(); }
});
['dragover', 'dragleave', 'drop'].forEach(t => document.addEventListener(t, e => {
  const z = e.target.closest?.('.drop'); if (!z) return; e.preventDefault();
  z.classList.toggle('over', t === 'dragover');
  if (t === 'drop' && e.dataTransfer.files.length) { const inp = z.querySelector('input[type=file]'); if (inp.dataset.upload) { handleUpload(inp.dataset.upload, [...e.dataTransfer.files], inp.dataset.i); return; } try { inp.files = e.dataTransfer.files; } catch { } inp.dispatchEvent(new Event('change', { bubbles: true })); }
}));
document.addEventListener('focusin', e => { if (e.target.classList?.contains('sinput')) renderSugg(e.target); });
document.addEventListener('focusout', () => setTimeout(() => { if (S.pendingRender && !isBusyUI()) liveRender(); }, 50));
window.addEventListener('beforeunload', e => { if (S.dirty || S.secDirty) { e.preventDefault(); e.returnValue = ''; } });

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  applyTheme();
  try { Store = wrapStore(DEMO ? await demoStore() : await fbStore()); }
  catch (e) { console.error(e); Store = wrapStore(await demoStore()); setTimeout(() => toast('Could not connect to Firebase', 'Running in demo mode. Check your internet connection and the Firebase keys.', { kind: 'error' }), 500); }
  const limit = (p, ms = 9000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))]);
  try {
    const [p, st, ga, dc] = await Promise.all([limit(Store.get('site', 'profile')), limit(Store.get('site', 'settings')).catch(() => null), limit(Store.listPublic('gallery')).catch(() => []), limit(Store.listPublic('documents')).catch(() => [])]);
    S.profile = normProfile(p); S.settings = st || null; S.gallery = ga || []; S.documents = dc || [];
  } catch (e) {
    console.warn(e); S.profile = normProfile(null);
    const c = e.code || '';
    S.dbProblem = /permission/.test(c) ? 'Database rules are not published yet. In Firebase open Firestore Database → Rules, paste the rules from firestore.rules and click Publish.'
      : /timeout|unavailable/.test(c) ? 'Could not reach the database. Check that Firestore Database has been created in Firebase (Build → Firestore Database → Create database).'
      : 'Database error: ' + (e.message || c);
    setTimeout(() => toast('Database problem', S.dbProblem, { kind: 'error', sticky: false }), 600);
  }
  applyMeta();
  applyTheme(); S.booted = true; try { startFavicon(); } catch { } subscribe();
  Store.onAuth(async u => {
    if (u && u.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) { await Store.logout(); toast('Access denied', 'This account is not the site admin.', { kind: 'error' }); return; }
    const changed = !!u !== !!S.user; S.user = u; S.authReady = true;
    if (!u && S.adminLoaded) { S.adminLoaded = false; subscribe(); }
    if (changed || ROUTE.startsWith('#/admin') || ROUTE.startsWith('#/login')) route();
  });
  if (!(S.authReady && (ROUTE.startsWith('#/admin') || ROUTE.startsWith('#/login')))) route();
  window.__booted = true;
})().catch(e => { console.error(e); window.__bootFail && window.__bootFail('The website could not start', String(e && e.message || e)); });

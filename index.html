<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD Mamun Uddin — Mathematics &amp; Computing Teacher</title>
<meta name="description" content="Portfolio of MD Mamun Uddin, secondary Mathematics and Computing Technology teacher based in Sydney.">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%234338ca%22/%3E%3Cstop offset=%221%22 stop-color=%22%230ea5e9%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%222%22 y=%222%22 width=%2260%22 height=%2260%22 rx=%2216%22 fill=%22url(%23g)%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-weight=%22800%22 font-size=%2226%22 fill=%22white%22 text-anchor=%22middle%22%3EMU%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Lora:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
/* ================= THEME TOKENS ================= */
:root{--accent:#1e3a8a;--accent-2:#0e7490;--accent-rgb:30,58,138;--radius:16px;
--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Fraunces',Georgia,serif}
:root,[data-mode=light]{--bg:#f4f6fb;--surface:#ffffff;--surface-2:#eef1f8;--text:#0e1530;--muted:#5a6482;--border:#e3e7f1;--shadow:0 1px 2px rgba(14,21,48,.04),0 10px 30px rgba(14,21,48,.06);--alt:#ffffff}
[data-mode=dark]{--bg:#0a0f1e;--surface:#111a2e;--surface-2:#172139;--text:#e8ecf6;--muted:#9aa4bb;--border:#233049;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--alt:#0d1426}
[data-mode=dim]{--bg:#1b1f27;--surface:#232833;--surface-2:#2b313d;--text:#e6e8ec;--muted:#a3a9b5;--border:#363d4a;--shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.3);--alt:#20242d}
[data-mode=paper]{--bg:#f7f3ea;--surface:#fffdf8;--surface-2:#f0eadc;--text:#2a2419;--muted:#6f6656;--border:#e5dccb;--shadow:0 1px 2px rgba(60,40,10,.05),0 8px 24px rgba(60,40,10,.07);--alt:#f1ebde}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;font-size:15.5px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}.small{font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.only-m{display:none!important}

/* ================= PRIMITIVES ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:calc(var(--radius)*.7);border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;transition:.2s;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:rgba(var(--accent-rgb),.55);color:var(--accent)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(var(--accent-rgb),.25)}
.btn-primary:hover{color:#fff;transform:translateY(-1px);box-shadow:0 10px 24px rgba(var(--accent-rgb),.34)}
.btn-lg{padding:13px 22px;font-size:15px}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-danger:hover{color:#e11d48;border-color:#e11d48}
.btn:disabled{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:calc(var(--radius)*.7);border:1px solid var(--border);background:var(--surface);transition:.2s;position:relative;flex:none}
.icon-btn:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.55)}
.icon-btn.sm{width:32px;height:32px;border-radius:calc(var(--radius)*.55)}
.icon-btn.ghost{border-color:transparent;background:transparent}
.icon-btn.ghost:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.35;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.chip.ac{background:rgba(var(--accent-rgb),.1);color:var(--accent);border-color:rgba(var(--accent-rgb),.22)}
.chip.ok{background:rgba(16,185,129,.12);color:#047857;border-color:rgba(16,185,129,.28)}
.chip.off{background:rgba(148,163,184,.14);color:var(--muted)}
[data-mode=dark] .chip.ok,[data-mode=dim] .chip.ok{color:#34d399}
.av{border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover}
.loader{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{min-height:100vh;display:grid;place-items:center}

/* ================= FORMS ================= */
.form{display:grid;gap:16px}
.fld{display:grid;gap:6px;font-size:13.5px;font-weight:600;align-content:start}
.fld>span{color:var(--muted)}
.fld small{color:var(--muted);font-weight:500;font-size:12px}
.inp,.fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border-radius:calc(var(--radius)*.65);border:1px solid var(--border);background:var(--bg);font-weight:500;font-size:14.5px;outline:none;transition:.15s}
.fld input[type=color]{padding:4px;height:44px;cursor:pointer}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.14)}
textarea{resize:vertical;line-height:1.55}
select.inp{width:auto;padding-right:30px}
.row2,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;padding:4px;border-radius:calc(var(--radius)*.75);background:var(--surface-2);border:1px solid var(--border);gap:4px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:calc(var(--radius)*.55);font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.drop{display:grid;place-items:center;gap:8px;padding:26px 18px;border:2px dashed var(--border);border-radius:var(--radius);text-align:center;color:var(--muted);cursor:pointer;transition:.2s;font-weight:600;font-size:14px}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(var(--accent-rgb),.05);color:var(--accent)}
.drop input{display:none}
.drop small{font-weight:500}
.err{color:#e11d48;font-size:13.5px;font-weight:600}

/* ================= PUBLIC SITE ================= */
.pnav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
.pnav-in{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12px}
.plinks-row{border-top:1px solid var(--border)}
.plinks{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:46px;align-items:center}
.plinks::-webkit-scrollbar{display:none}
.plinks a{padding:7px 12px;border-radius:calc(var(--radius)*.6);font-weight:600;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.plinks a:hover,.plinks a.on{color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.pnav-act{display:flex;gap:8px;align-items:center;flex:none}
/* public search */
.psearch{position:relative;flex:1;max-width:520px;margin-left:auto}
.psearch input{width:100%;height:44px;padding:0 70px 0 42px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14.5px;font-weight:500;outline:none;transition:.15s}
.psearch input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.14)}
.psearch>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.psearch kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 11px var(--font);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--bg)}
.sdd{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:70;padding:6px;max-height:min(440px,70vh);overflow-y:auto;display:none}
.sdd.open{display:block;animation:pop .15s ease}
.sdd-h{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.sitem{display:flex;gap:12px;align-items:center;width:100%;padding:9px 10px;border-radius:calc(var(--radius)*.6);text-align:left}
.sitem:hover,.sitem.sel{background:rgba(var(--accent-rgb),.08)}
.sitem .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.sitem div{min-width:0;flex:1}
.sitem b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem mark{background:rgba(var(--accent-rgb),.18);color:inherit;border-radius:3px;padding:0 1px}
.sitem .go{color:var(--muted);flex:none}
.s-empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.hero{position:relative;padding:72px 0 40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-30% -10% auto;height:720px;background:radial-gradient(620px 320px at 10% 25%,rgba(var(--accent-rgb),.13),transparent 70%),radial-gradient(520px 320px at 90% 10%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 70%);pointer-events:none}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:1.3fr .85fr;gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18);flex:none}
.hero h1{font-family:var(--display);font-size:clamp(40px,6vw,68px);line-height:1.04;letter-spacing:-.02em;margin:20px 0 12px}
.hero-title{font-size:clamp(17px,2vw,21px);font-weight:700;color:var(--accent)}
.hero-tag{color:var(--muted);font-size:17px;max-width:560px;margin:14px 0 28px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:26px;color:var(--muted);font-size:14px}
.hero-meta>*{display:inline-flex;align-items:center;gap:7px}
.hero-meta a:hover{color:var(--accent)}
.hero-visual{position:relative;justify-self:center;width:min(340px,78vw);aspect-ratio:4/5}
.hero-visual::before{content:"";position:absolute;inset:22px -22px -22px 22px;border-radius:calc(var(--radius)*1.6);background:linear-gradient(135deg,var(--accent),var(--accent-2));opacity:.92}
.portrait{position:absolute;inset:0;border-radius:calc(var(--radius)*1.6);overflow:hidden;background:var(--surface);border:6px solid var(--surface);box-shadow:0 30px 60px rgba(15,23,42,.18)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait span{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-size:clamp(64px,10vw,100px);color:var(--accent);background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.float{position:absolute;display:flex;gap:10px;align-items:center;padding:11px 15px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;line-height:1.3;z-index:2}
.float .fi{width:34px;height:34px;border-radius:calc(var(--radius)*.6);display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.float b{display:block}.float small{color:var(--muted)}
.f1{left:-44px;bottom:12%}.f2{right:-44px;top:8%}
/* hero picture styles */
.hero-visual::before{background:linear-gradient(135deg,var(--fa,var(--accent)),var(--fb,var(--accent-2)))}
.portrait .hs{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease;background:var(--surface-2)}
.portrait .hs.on{opacity:1}
.hcap{position:absolute;left:0;right:0;bottom:0;padding:38px 18px 14px;font-weight:600;font-size:14px;line-height:1.4;background:linear-gradient(transparent,rgba(0,0,0,.68));z-index:2;transition:opacity .4s}
.hcap.plain{background:none;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.hcap:empty{display:none}
.hdots{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.hdots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.3s}
.hdots button.on{background:#fff;width:22px}
.shape-circle{aspect-ratio:1}
.shape-circle .portrait,.shape-circle::before{border-radius:50%!important}
.shape-arch .portrait,.shape-arch::before{border-radius:999px 999px calc(var(--radius)*1.6) calc(var(--radius)*1.6)!important}
.shape-square .portrait,.shape-square::before{border-radius:6px!important}
.shape-circle .hcap{padding-bottom:30px;text-align:center}
.frame-glow::before{inset:-6px!important;filter:blur(26px);opacity:.6!important}
.frame-ring::before{inset:-10px!important;opacity:1!important}
.frame-none::before{display:none}
.frame-none .portrait{border:0}
.hero-prev{display:grid;place-items:center;padding:36px 50px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}
.slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.slide{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg)}
.slide img{width:100%;aspect-ratio:4/3;object-fit:cover}
.slide .sb{padding:10px;display:grid;gap:8px}
.slide .sb .arr-tools{justify-content:flex-end}
.slide .num{position:absolute;top:8px;left:8px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick-grid button{border-radius:12px;overflow:hidden;aspect-ratio:1;border:3px solid transparent}
.pick-grid button:hover{border-color:var(--accent)}
.pick-grid img{width:100%;height:100%;object-fit:cover}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:56px;flex:none}
.color-row .btn{flex:none}
.stats-row{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);margin-top:64px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:24px;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat b{font-family:var(--display);font-size:40px;line-height:1;color:var(--accent);display:block}
.stat span{display:block;font-weight:700;margin-top:10px}
.stat small{color:var(--muted);font-size:13px}
.sec{padding:84px 0;scroll-margin-top:116px}
.sec.alt{background:var(--alt)}
.sec-head{max-width:680px;margin-bottom:40px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.eyebrow::before{content:"";width:26px;height:2px;background:currentColor;border-radius:2px}
.sec-head h2{font-family:var(--display);font-size:clamp(29px,4vw,42px);letter-spacing:-.01em}
.sec-head p{color:var(--muted);margin-top:10px;font-size:16px}
.about-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:34px;align-items:start}
.about-text{font-size:17px;white-space:pre-line}
.quote{margin-top:26px;padding:22px 24px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--radius) var(--radius) 0;font-family:var(--display);font-size:19px;line-height:1.5;box-shadow:var(--shadow)}
.quote small{display:block;font-family:var(--font);font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.facts{padding:24px;display:grid;gap:18px}
.fact{display:flex;gap:14px;align-items:flex-start}
.fact .fi{width:40px;height:40px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent);flex:none}
.fact small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.fact div{font-weight:600}
.edu-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.edu-col{padding:28px}
.edu-col-h{display:flex;align-items:center;gap:13px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.flag{font-size:30px;line-height:1}
.edu-col-h h3{font-size:19px}
.edu-col-h small{color:var(--muted);font-weight:600}
.tl{position:relative;display:grid;gap:22px;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),rgba(var(--accent-rgb),.05))}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-item h4{font-size:16.5px}
.tl-item .inst{font-weight:600;color:var(--accent);font-size:14.5px}
.tl-item p{color:var(--muted);font-size:14.5px;margin-top:6px}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}
.pl{padding:28px;position:relative;overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.pl:hover{transform:translateY(-4px);border-color:rgba(var(--accent-rgb),.4)}
.pl-num{position:absolute;right:22px;top:12px;font-family:var(--display);font-size:64px;font-weight:700;color:rgba(var(--accent-rgb),.08);line-height:1}
.pl-ic{width:50px;height:50px;border-radius:var(--radius);display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin-bottom:18px}
.pl h3{font-size:20px;padding-right:60px}
.pl .role{color:var(--accent);font-weight:600;font-size:14.5px;margin-top:2px}
.pl .period{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:4px}
.pl .sum{color:var(--muted);font-size:14.5px}
.pl ul{margin:14px 0 0;list-style:none;display:grid;gap:9px}
.pl li{display:flex;gap:10px;font-size:14.5px}
.pl li svg{color:var(--accent);flex:none;margin-top:3px}
.pl-foot{margin-top:auto;padding-top:20px}
.yrs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:20px}
.skill{padding:24px}
.skill h3{font-size:17px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.skill h3 i{width:38px;height:38px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent);font-style:normal;flex:none}
.skill .chips{display:flex;flex-wrap:wrap;gap:8px}
.skill .chip{font-size:13px;color:var(--text);background:var(--bg)}
.creds{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.creds .chip{padding:8px 14px;font-size:13.5px}
.work{display:grid;gap:14px;margin-top:40px}
.work h3{font-size:18px}
.work-item{display:flex;gap:16px;padding:18px 20px;align-items:flex-start}
.work-item .fi{width:42px;height:42px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.work-item b{display:block}.work-item small{color:var(--muted);font-weight:600}
.work-item ul{margin:6px 0 0 18px;color:var(--muted);font-size:14.5px}
/* gallery */
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.gal{columns:4 230px;column-gap:16px}
.gal figure{break-inside:avoid;margin:0 0 16px;border-radius:var(--radius);overflow:hidden;position:relative;cursor:zoom-in;background:var(--surface-2);box-shadow:var(--shadow)}
.gal img{width:100%;height:auto;transition:transform .5s}
.gal figure:hover img{transform:scale(1.04)}
.gal figcaption{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;color:#fff;font-size:13.5px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.7));opacity:0;transition:.25s}
.gal figure:hover figcaption{opacity:1}
@media (hover:none){.gal figcaption{opacity:1}}
/* documents */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.doc-cat{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.doc-cat:first-child{margin-top:0}
.doc-cat::after{content:"";flex:1;height:1px;background:var(--border)}
.doc{padding:20px;display:flex;flex-direction:column;gap:12px;transition:.2s}
.doc:hover{transform:translateY(-3px);border-color:rgba(var(--accent-rgb),.4)}
.doc-top{display:flex;gap:12px;align-items:flex-start}
.doc-top div{min-width:0}
.doc h4{font-size:15.5px}
.doc p{font-size:13.5px;color:var(--muted)}
.doc-act{display:flex;gap:8px;margin-top:auto}
/* cv block */
.cv-card{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:30px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.08),transparent 60%),var(--surface)}
.cv-ic{width:72px;height:88px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 14px 28px rgba(var(--accent-rgb),.3);position:relative}
.cv-ic::after{content:"CV";position:absolute;bottom:8px;font-size:11px;font-weight:800;letter-spacing:.1em}
.cv-card h3{font-size:21px}
.cv-act{display:flex;gap:10px;flex-wrap:wrap}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ct{padding:20px;display:flex;gap:14px;align-items:center;transition:.2s;min-width:0}
a.ct:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-2px)}
.ct .fi{width:46px;height:46px;border-radius:calc(var(--radius)*.75);display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;flex:none}
.ct small{display:block;color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ct div{min-width:0}
.ct b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.soc{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:14px;transition:.2s;box-shadow:var(--shadow)}
.soc:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.soc i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-style:normal;font-size:12px;font-weight:800}
.pfoot{padding:44px 0 30px;border-top:1px solid var(--border);color:var(--muted);font-size:14px;background:var(--surface)}
.pfoot-in{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.pfoot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.pfoot a:hover{color:var(--accent)}
.pfoot .copy{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}



/* ================= PUBLIC LAYOUT: sidebar / top bar / mobile drawer ================= */
.psidebar{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:80;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px 18px;overflow-y:auto;scrollbar-width:thin}
.ps-brand{display:flex;gap:12px;align-items:center;padding:4px 6px 20px;border-bottom:1px solid var(--border);margin-bottom:14px}
.ps-brand b{display:block;font-size:15.5px;line-height:1.25}
.ps-brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;line-height:1.35}
.ps-brand div{min-width:0;flex:1}
.ps-close{display:none!important}
.ps-nav{display:grid;gap:3px}
.ps-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:calc(var(--radius)*.7);font-weight:600;font-size:14.5px;color:var(--muted);transition:background .2s,color .2s,transform .2s;position:relative}
.ps-item svg{flex:none;transition:transform .25s}
.ps-item:hover{background:var(--surface-2);color:var(--text)}
.ps-item:hover svg{transform:scale(1.15) rotate(-6deg)}
.ps-item.on{background:linear-gradient(135deg,rgba(var(--accent-rgb),.14),rgba(var(--accent-rgb),.04));color:var(--accent)}
.ps-item.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.ps-soc{display:flex;flex-wrap:wrap;gap:8px;padding:16px 6px 0;margin-top:14px;border-top:1px solid var(--border)}
.ps-soc a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);font-weight:800;font-size:12px;transition:.2s}
.ps-soc a:hover{background:var(--accent);color:#fff;transform:translateY(-3px)}
.ps-foot{margin-top:auto;padding-top:18px;display:flex;gap:8px;align-items:center}
.ps-foot .btn{flex:1}
.pback{display:none}
.layout-sidebar .pmain{margin-left:264px}
.layout-sidebar .mtop{display:none}
.mtop{position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
.mtop-in{display:flex;align-items:center;gap:16px;height:66px;max-width:1240px;margin:0 auto;padding:0 22px}
.mtop .brand span{min-width:0}
.tlinks{display:flex;gap:2px;margin-left:auto}
.tlinks a{padding:8px 11px;border-radius:calc(var(--radius)*.6);font-weight:600;font-size:14px;color:var(--muted);transition:.15s;white-space:nowrap}
.tlinks a:hover,.tlinks a.on{color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.layout-topbar .psidebar{transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 60px rgba(0,0,0,.25)}
.layout-topbar .psidebar.open{transform:none}
.layout-topbar .mburger{display:none}
.nav-open .pback{display:block;position:fixed;inset:0;z-index:75;background:rgba(6,10,22,.5);backdrop-filter:blur(2px);animation:fade .25s}
.edit-pill{display:inline-flex;align-items:center;gap:6px;margin-left:10px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(var(--accent-rgb),.1);color:var(--accent);border:1px dashed rgba(var(--accent-rgb),.45);vertical-align:middle;transition:.2s}
.edit-pill:hover{background:var(--accent);color:#fff;border-style:solid}
.hero-text>.edit-pill{margin:0 0 12px;display:inline-flex}
.adminbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--text);color:var(--bg);box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:13.5px;font-weight:600;animation:tin .5s ease}
.adminbar .btn:not(.btn-primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.layout-sidebar .adminbar{left:calc(50% + 132px)}
.btt{position:fixed;right:22px;bottom:22px;z-index:85;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 26px rgba(var(--accent-rgb),.4);opacity:0;transform:translateY(20px) scale(.8);pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1.3)}
.btt.show{opacity:1;transform:none;pointer-events:auto}
.btt:hover{transform:translateY(-4px)}
.sprog{position:fixed;top:0;left:0;height:3px;width:0;z-index:95;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px rgba(var(--accent-rgb),.6);transition:width .1s linear}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:progmove 1.1s ease-in-out infinite}
#prog.on{opacity:1}
#loadpill{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);z-index:390;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#loadpill.on{transform:translate(-50%,0)}
#loadpill .loader{width:18px;height:18px;border-width:2.5px;margin:0;border-color:color-mix(in srgb,var(--bg) 30%,transparent);border-top-color:var(--bg)}
.toast-shift #toasts{top:68px}
@keyframes progmove{from{background-position:-40% 0}to{background-position:140% 0}}

/* ================= ANIMATIONS (admin-controlled) ================= */
.reveal{opacity:0;transition:opacity var(--ad,.7s) ease,transform var(--ad,.7s) cubic-bezier(.2,.7,.2,1),filter var(--ad,.7s) ease}
[data-anim=fade-up] .reveal{transform:translateY(30px)}
[data-anim=fade] .reveal{transform:none}
[data-anim=zoom] .reveal{transform:scale(.9)}
[data-anim=slide] .reveal{transform:translateX(-46px)}
[data-anim=flip] .reveal{transform:perspective(900px) rotateX(22deg) translateY(24px);transform-origin:50% 0}
[data-anim=blur] .reveal{filter:blur(10px);transform:scale(1.03)}
[data-anim=none] .reveal{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
.reveal.in{opacity:1;transform:none;filter:none}
[data-hover=off] .card:hover,[data-hover=off] .stat:hover{transform:none!important}
[data-hover=on] .stat{transition:transform .3s,box-shadow .3s}
[data-hover=on] .skill:hover,[data-hover=on] .ct:hover,[data-hover=on] .doc:hover,[data-hover=on] .work-item:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(var(--accent-rgb),.14)}
[data-hover=on] .skill,[data-hover=on] .work-item{transition:transform .3s,box-shadow .3s}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:140%}}
.caret{display:inline-block;width:3px;height:1em;margin-left:3px;vertical-align:-.12em;background:currentColor;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero h1{background:linear-gradient(120deg,var(--text) 30%,var(--accent) 50%,var(--text) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text}
.hero h1:not([style]){color:transparent;animation:namesheen 7s ease-in-out infinite}
@keyframes namesheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
.float{animation:bob 6s ease-in-out infinite}.f2{animation-delay:-3s}
@keyframes bob{50%{transform:translateY(-10px)}}
.pl-ic,.skill h3 i,.fact .fi{transition:transform .4s cubic-bezier(.2,.9,.3,1.4)}
.pl:hover .pl-ic,.skill:hover h3 i,.fact:hover .fi{transform:rotate(-8deg) scale(1.12)}
.eyebrow::before{transition:width .6s}
.sec-head.in .eyebrow::before{animation:grow .9s ease .2s both}
@keyframes grow{from{width:0}}
/* hero backgrounds */
.hero-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:blob 18s ease-in-out infinite}
.bg-blobs i:nth-child(1){width:380px;height:380px;background:var(--accent);left:-80px;top:-60px}
.bg-blobs i:nth-child(2){width:320px;height:320px;background:var(--accent-2);right:-60px;top:20%;animation-delay:-6s}
.bg-blobs i:nth-child(3){width:260px;height:260px;background:color-mix(in srgb,var(--accent) 50%,#f59e0b);left:40%;bottom:-120px;animation-delay:-12s}
@keyframes blob{33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,30px) scale(.92)}}
.bg-math span{position:absolute;color:var(--accent);opacity:.13;font-family:var(--display);font-weight:700;animation:drift 18s ease-in-out infinite;white-space:nowrap}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(10deg)}}
.bg-grid{background-image:linear-gradient(rgba(var(--accent-rgb),.12) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--accent-rgb),.12) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at 60% 40%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 10%,transparent 70%);animation:gridpan 20s linear infinite}
@keyframes gridpan{to{background-position:40px 40px,40px 40px}}
.bg-gradient{background:linear-gradient(120deg,rgba(var(--accent-rgb),.16),color-mix(in srgb,var(--accent-2) 16%,transparent),transparent,rgba(var(--accent-rgb),.12));background-size:300% 300%;animation:gshift 14s ease infinite}
@keyframes gshift{50%{background-position:100% 50%}}
.hero .wrap{position:relative;z-index:1}

}

/* ================= v6.2: ANIMATED LOGIN ================= */
.lg{min-height:100vh;position:relative;overflow:hidden;display:grid;place-items:center;padding:28px 18px;color:#fff;background:linear-gradient(125deg,#0b1230,#1e1b4b 30%,#4c1d95 55%,#0c4a6e 80%,#0b1230);background-size:320% 320%;animation:lgbg 22s ease infinite}
@keyframes lgbg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#lgfx{position:absolute;inset:0;width:100%;height:100%}
.lg-blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;animation:lgblob 20s ease-in-out infinite}
.lg-blobs i:nth-child(1){width:420px;height:420px;background:#6366f1;left:-120px;top:-100px}
.lg-blobs i:nth-child(2){width:360px;height:360px;background:#ec4899;right:-80px;top:18%;animation-delay:-5s}
.lg-blobs i:nth-child(3){width:320px;height:320px;background:#06b6d4;left:28%;bottom:-140px;animation-delay:-10s}
.lg-blobs i:nth-child(4){width:240px;height:240px;background:#f59e0b;right:22%;bottom:10%;opacity:.3;animation-delay:-15s}
@keyframes lgblob{25%{transform:translate(70px,40px) scale(1.12)}50%{transform:translate(-30px,80px) scale(.9)}75%{transform:translate(-60px,-30px) scale(1.05)}}
.lg-syms span{position:absolute;bottom:-60px;color:rgba(255,255,255,.18);font-family:Georgia,serif;font-weight:700;animation:lgrise linear infinite;white-space:nowrap}

.lg-side h1{font-family:var(--display);font-size:clamp(34px,4.6vw,54px);line-height:1.08;margin:22px 0 10px;animation:lgup .8s cubic-bezier(.2,.8,.2,1) both}
.lg-side>p{font-size:17px;opacity:.82;animation:lgup .8s .1s cubic-bezier(.2,.8,.2,1) both}
.lg-grad{background:linear-gradient(90deg,#a5b4fc,#67e8f9,#f9a8d4,#a5b4fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lggrad 6s linear infinite}
@keyframes lggrad{to{background-position:300% 0}}
.lg-av{position:relative;display:inline-block;animation:lgup .8s cubic-bezier(.2,.8,.2,1) both}
.lg-av .av{position:relative;z-index:1;border:3px solid rgba(255,255,255,.85);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.lg-ring{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(#6366f1,#06b6d4,#ec4899,#f59e0b,#6366f1);animation:spin 6s linear infinite;filter:blur(1px)}
.lg-ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#1e1b4b}
.lg-feats{list-style:none;display:grid;gap:12px;margin-top:28px}
.lg-side{text-align:center;display:flex;flex-direction:column;align-items:center}.lg-side .lg-feats{text-align:left;width:max-content;max-width:100%}.lg-av{margin:10px}
.lg-feats li{display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;opacity:0;animation:lgup .7s var(--d) cubic-bezier(.2,.8,.2,1) forwards}

@keyframes lgup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.lg-card{position:relative;padding:34px 32px 24px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 30px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);animation:lgcard .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes lgcard{from{opacity:0;transform:translateY(30px) scale(.96)}}

.pv-t{display:grid;min-width:0}.pv-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pv-t small{color:var(--muted);font-size:12px}
.pv-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pv-body{flex:1;overflow:auto;background:#525659;padding:24px 12px}
.pv-pages{display:grid;gap:22px;justify-content:center;zoom:var(--z,.8)}
.pv-page{width:794px;min-height:1123px;padding:76px!important;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.45);margin:0!important;border-radius:2px}
.pv-no{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:600 11px system-ui;color:#94a3b8}
@media(max-width:720px){.pv-bar{padding:8px 10px}.pv-t small{display:none}.pv-z{display:none!important}.pv-pages{zoom:.46}.pv-body{padding:12px 6px}}
.lib-top{display:grid;gap:12px;padding:14px;margin-bottom:10px}
.lib-yr{grid-template-columns:repeat(6,1fr)!important}
.lib-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lib-s{flex:1 1 220px;max-width:none!important}
.lib-opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600}.lib-opts label{display:inline-flex;gap:6px;align-items:center}.lib-opts select{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:0 6px}
.lib-sum{margin:0 4px 16px}
.lib-topic{margin-bottom:22px}
.lib-th{display:flex;gap:12px;align-items:center;margin-bottom:10px}.lib-th>div{flex:1;min-width:0}.lib-th h3{font-size:18px}.lib-th small{color:var(--muted);font-weight:600;font-size:12px}
.lib-num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--sc);flex:none;box-shadow:0 6px 14px -6px var(--sc)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.lib-ws{display:flex;flex-direction:column;gap:8px;padding:16px;border-top:4px solid var(--sc);transition:.18s}
.lib-ws:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px var(--sc)}
.lib-wh{display:flex;gap:6px;align-items:center}.lib-step{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--sc)}
.lib-ws h4{font-size:16px;line-height:1.3}
.lib-secs{list-style:none;display:grid;gap:4px;margin:2px 0 4px;counter-reset:s}
.lib-secs li{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);counter-increment:s}
.lib-secs li::before{content:counter(s,upper-alpha);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc);flex:none}
.lib-secs span{flex:1;min-width:0}.lib-secs em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface-2);padding:1px 7px;border-radius:99px}
.lib-acts{display:flex;gap:2px;flex-wrap:nowrap;align-items:center;margin-top:auto;padding-top:6px}.lib-acts .btn{flex:none}.lib-acts .btn:nth-child(2){margin-right:auto}.lib-acts .icon-btn{width:30px;flex:none}
.lib-eh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;margin-bottom:14px;position:sticky;top:72px;z-index:12}
.lib-meta{flex-basis:100%;display:grid;grid-template-columns:110px 1fr 1fr;gap:10px}
.lib-sec{margin-bottom:14px}
.lib-sh{display:flex;gap:10px;align-items:center;margin-bottom:12px}.lib-sh .inp{flex:1;font-weight:700;font-size:15px}
@media(max-width:720px){.lib-yr{grid-template-columns:repeat(3,1fr)!important}.lib-meta{grid-template-columns:1fr 1fr}.lib-meta label:last-child{grid-column:1/-1}.lib-eh{position:static}.lib-th h3{font-size:16px}}
/* ================= CV DOCUMENT PREVIEW ================= */
.cvdoc{background:#fff;color:#1a1a1a;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.45;padding:48px 52px;max-width:820px;width:100%;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.cvdoc h1{font-size:32px;line-height:1.1;margin-bottom:4px;font-family:inherit}
.cvdoc .cv-t{font-size:16px;color:#333}
.cvdoc .cv-c{font-size:13px;color:#555;margin-top:4px}
.cvdoc h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid;padding-bottom:3px;margin:20px 0 9px;font-family:inherit}
.cvdoc .cv-e{margin-bottom:10px}
.cvdoc .cv-r{display:flex;justify-content:space-between;gap:12px}
.cvdoc .cv-r span{color:#555;font-size:13px;white-space:nowrap}
.cvdoc i{display:block;color:#333}
.cvdoc ul{margin:3px 0 0 20px}
.cvdoc p{margin:2px 0}
.cv-scroll{overflow:auto;padding:24px;background:var(--surface-2);flex:1}
.cv-prev-wrap{max-height:640px;overflow:auto;border-radius:var(--radius);background:var(--surface-2);padding:18px;border:1px solid var(--border)}
.cv-prev-wrap .cvdoc{padding:34px 36px;font-size:13px}

/* ================= AUTH ================= */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.auth::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 20% 20%,rgba(var(--accent-rgb),.16),transparent 70%),radial-gradient(500px 300px at 80% 80%,color-mix(in srgb,var(--accent-2) 16%,transparent),transparent 70%)}
.auth-card{position:relative;width:min(430px,100%);padding:34px}
.auth-card h2{font-family:var(--display);font-size:28px;margin:18px 0 4px}
.hint{padding:12px 14px;border-radius:calc(var(--radius)*.7);background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.2);font-size:13.5px}

/* ================= ADMIN SHELL ================= */
.shell{display:grid;grid-template-columns:276px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:3px;scrollbar-width:thin}
.side-brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px}
.side-brand b{display:block;font-size:15px;line-height:1.2}
.side-brand small{color:var(--muted);font-size:12px;font-weight:600}
.side-label{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:16px 11px 6px;display:flex;justify-content:space-between;align-items:center}
.side-label a{color:var(--accent);letter-spacing:0;text-transform:none;font-size:12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:calc(var(--radius)*.7);font-weight:600;font-size:14.5px;color:var(--muted);transition:.15s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.nav-item .emo{width:22px;text-align:center;font-size:16px;line-height:1;flex:none;display:grid;place-items:center}
.nav-item .cnt{margin-left:auto;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:700}
.nav-item.on .cnt{background:var(--accent);color:#fff}
.nav-item .cnt.red{background:#e11d48;color:#fff}
.cnt[data-n="0"]{display:none}
.nav-subs{display:grid;gap:1px;margin:2px 0 6px 22px;padding-left:12px;border-left:2px solid var(--border)}
.nav-sub{padding:6px 10px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.nav-sub:hover{color:var(--text);background:var(--surface-2)}
.nav-sub.on{color:var(--accent);background:rgba(var(--accent-rgb),.06)}
.nav-sub em{font-style:normal;font-size:12px;opacity:.7}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);background:var(--surface-2);margin-top:18px}
.side-user div{min-width:0;flex:1}
.side-user b{display:block;font-size:14px}
.side-user small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-backdrop{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);min-height:68px}
.tb-title{font-weight:800;font-size:18px;min-width:0;flex:1}
.tb-title small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.tb-search{position:relative;width:min(300px,30vw)}
.tb-search input{padding-left:38px;background:var(--surface)}
.tb-search svg,.tb-s svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#e11d48;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.badge[data-n="0"]{display:none}
.bell-wrap{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 10px);width:min(370px,calc(100vw - 24px));z-index:60;display:none;overflow:hidden}
.dd.open{display:block;animation:pop .18s ease}
.dd-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.dd-list{max-height:380px;overflow-y:auto}
.dd-f{display:block;text-align:center;padding:12px;font-weight:700;font-size:13.5px;color:var(--accent);border-top:1px solid var(--border)}
.dd-f:hover{background:var(--surface-2)}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.content{padding:26px;display:grid;gap:22px;align-content:start;width:100%;max-width:1400px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:rgba(234,179,8,.15);color:#a16207;font-size:11.5px;font-weight:700;border:1px solid rgba(234,179,8,.3)}
[data-mode=dark] .demo-chip,[data-mode=dim] .demo-chip{color:#facc15}

/* ================= DASHBOARD ================= */
.welcome{padding:28px 30px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.welcome::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.1)}
.welcome>*{position:relative;z-index:1}
.welcome h2{font-family:var(--display);font-size:clamp(23px,3vw,30px)}
.welcome p{opacity:.92;margin-top:4px;max-width:520px}
.welcome .btns{display:flex;gap:10px;flex-wrap:wrap}
.welcome .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.welcome .btn:hover{background:rgba(255,255,255,.28)}
.welcome .btn.solid{background:#fff;color:var(--accent);border-color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.kpi{padding:18px;display:flex;gap:14px;align-items:center;transition:.2s}
a.kpi:hover{transform:translateY(-2px)}
.kpi .ki{width:46px;height:46px;border-radius:calc(var(--radius)*.75);display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc);flex:none}
.kpi b{font-size:26px;line-height:1;display:block}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.g2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
.panel{padding:22px}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.panel-h h3{font-size:16.5px;display:flex;align-items:center;gap:9px}
.panel-h p{font-size:13.5px;margin-top:2px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 34px;gap:12px;align-items:center;font-size:14px;font-weight:600;padding:7px 8px;border-radius:10px}
a.bar-row:hover{background:var(--surface-2)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar-row span:last-child{text-align:right;color:var(--muted)}
.checklist{display:grid;gap:4px}
.ck{display:flex;gap:11px;align-items:center;font-size:14.5px;padding:8px;border-radius:10px;font-weight:600}
a.ck:hover{background:var(--surface-2)}
.ck i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);flex:none;font-style:normal}
.ck.done i{background:#10b981;border-color:#10b981;color:#fff}
.ck.done span{color:var(--muted);text-decoration:line-through}
.ck .go{margin-left:auto;color:var(--muted)}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);border-radius:inherit}

/* ================= RESOURCES ================= */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h2{font-size:clamp(22px,3vw,28px);display:flex;align-items:center;gap:12px;font-family:var(--display)}
.page-h h2 .emo{font-size:30px;font-family:var(--font)}
.page-h .acts{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{padding:8px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--muted);display:inline-flex;gap:8px;align-items:center;transition:.15s;cursor:pointer}
.tab:hover{color:var(--text)}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab em{font-style:normal;font-size:12px;opacity:.65}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tb-s{flex:1;min-width:200px;position:relative}
.tb-s input{padding-left:38px;background:var(--surface)}
.toolbar select{background:var(--surface)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.res{padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative;min-width:0}
.res:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--tc) 50%,var(--border))}
.res-top{display:flex;align-items:center;gap:11px}
.res-ic{width:42px;height:42px;border-radius:calc(var(--radius)*.7);display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);flex:none}
.res-type{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tc)}
.res-tools{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.15s}
.res:hover .res-tools,.res:focus-within .res-tools{opacity:1}
@media (hover:none){.res-tools{opacity:1}}
.res h4{font-size:15.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.res-desc{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-meta{display:flex;gap:6px;flex-wrap:wrap}
.res-meta .chip{font-size:11.5px;padding:2px 9px}
.res-foot{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--border);font-weight:600}
.empty{padding:50px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty .ei{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.empty b{color:var(--text);font-size:16.5px}
.mini-list{display:grid}
.mini{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:11px;cursor:pointer;min-width:0}
.mini:hover{background:var(--surface-2)}
.mini .res-ic{width:36px;height:36px}
.mini div{min-width:0;flex:1}
.mini b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini small{color:var(--muted);font-size:12.5px}
.agal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gcard{overflow:hidden;display:flex;flex-direction:column}
.gcard .gimg{aspect-ratio:4/3;background:var(--surface-2);cursor:zoom-in;overflow:hidden;position:relative}
.gcard .gimg img{width:100%;height:100%;object-fit:cover}
.gcard .gimg .chip{position:absolute;top:10px;left:10px}
.gcard .gb{padding:12px 14px;display:flex;gap:8px;align-items:center}
.gcard .gb div{min-width:0;flex:1}
.gcard b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard small{color:var(--muted);font-size:12.5px}
.dlist{display:grid}
.drow{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);min-width:0}
.drow:last-child{border-bottom:0}
.drow .t{min-width:0;flex:1;cursor:pointer}
.drow b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow small{color:var(--muted);font-size:12.5px}
.drow .acts{display:flex;gap:4px;align-items:center;flex:none}

/* ================= MODAL / VIEWER ================= */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(6,10,22,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes dropin{from{opacity:0;transform:translateY(-30px)}}
.modal{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;animation:pop .22s ease}
.modal.wide{width:min(1100px,100%);padding:0;display:flex;flex-direction:column;height:calc(100vh - 40px);overflow:hidden}
.modal h3{font-size:20px}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.vw-h{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.vw-h .t{min-width:0;flex:1}
.vw-h h3{font-size:16.5px}
.vw-h small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-act{display:flex;gap:8px;flex-wrap:wrap}
.vw-body{flex:1;min-height:0;background:var(--surface-2);display:flex;overflow:auto}
.vw-body iframe,.vw-body video{width:100%;height:100%;border:0;background:#fff;display:block}
.vw-body video{background:#000}
.vw-body>img{max-height:100%;max-width:100%;margin:auto;object-fit:contain;padding:14px}
.vw-note{padding:30px;white-space:pre-wrap;font-size:15.5px;max-width:820px;margin:0 auto;width:100%;align-self:flex-start;word-break:break-word}
.vw-msg{margin:auto;text-align:center;padding:40px 24px;display:grid;gap:12px;justify-items:center;color:var(--muted);max-width:460px}
.vw-msg b{color:var(--text);font-size:17px}
.vw-desc{padding:12px 20px;border-top:1px solid var(--border);font-size:14px;color:var(--muted)}
.lb{background:#05070d;color:#fff}
.lb .vw-h{border-color:rgba(255,255,255,.1)}
.lb .vw-h small{color:rgba(255,255,255,.6)}
.lb .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.lb .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:16px 64px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px!important;height:46px!important;border-radius:50%!important}
.lb-prev{left:12px}.lb-next{right:12px}
.lb-cap{padding:12px 20px 18px;text-align:center;color:rgba(255,255,255,.8);font-size:14.5px}

/* ================= TOASTS ================= */
#toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:400;display:grid;gap:10px;width:min(420px,calc(100vw - 24px));pointer-events:none}
#toasts .toast{pointer-events:auto}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:0 18px 44px rgba(0,0,0,.2);cursor:pointer;animation:tin .35s cubic-bezier(.2,.9,.3,1.2);border-left:4px solid var(--accent);transition:.3s}
.toast.error{border-left-color:#e11d48}.toast.error .ti{color:#e11d48;background:rgba(225,29,72,.1)}
.toast.out{opacity:0;transform:translateY(-20px)}
@keyframes tin{from{opacity:0;transform:translateY(-24px) scale(.95)}}
.toast .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent);flex:none}
.toast div{min-width:0;flex:1}
.toast b{display:block;font-size:14px}
.toast small{color:var(--muted);font-size:13px;display:block;word-break:break-word}
.toast .tx{color:var(--muted);flex:none}

/* ================= NOTIFICATIONS ================= */
.split{display:grid;grid-template-columns:390px 1fr;gap:20px;height:calc(100vh - 120px);min-height:460px}
.split>.card{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.split-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.nlist{overflow-y:auto;flex:1}
.ni{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;min-width:0}
.ni:hover{background:var(--surface-2)}
.ni.on{background:rgba(var(--accent-rgb),.08);box-shadow:inset 3px 0 0 var(--accent)}
.ni-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.ni div{min-width:0;flex:1}
.ni b{font-size:14px;display:flex;align-items:center;gap:8px}
.ni.unread b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ni p{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni small{color:var(--muted);font-size:12px;font-weight:600}
.split-detail{padding:32px;overflow-y:auto}
.nd-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin-bottom:18px}
.split-detail h2{font-family:var(--display);font-size:26px}
.nd-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}
.nd-msg{font-size:16px;padding:18px 20px;border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border);white-space:pre-wrap}
.nd-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ================= EDITORS ================= */
.arr{display:grid;gap:14px}
.arr-item{padding:18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
.arr-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.arr-head strong{flex:1;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arr-head .inp{flex:1;min-width:0;font-weight:700}
.arr-head .emo-in{flex:0 0 54px;width:54px;text-align:center;font-size:20px;padding:8px}
.arr-tools{display:flex;gap:4px;flex:none}
.sub-list{display:grid;gap:8px;padding-left:14px;border-left:2px solid var(--border);margin-left:24px}
.sub-row{display:flex;gap:8px;align-items:center}
.sub-row .inp{flex:1;min-width:0;padding:9px 12px;font-size:14px}
.sub-row .muted{white-space:nowrap;font-size:12.5px;font-weight:600}
.sub-list>.btn{justify-self:start}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.savebar{position:sticky;bottom:16px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;border-radius:var(--radius);background:var(--text);color:var(--bg);box-shadow:0 16px 40px rgba(0,0,0,.28);transform:translateY(160%);opacity:0;transition:.3s;pointer-events:none;font-weight:600;font-size:14px;flex-wrap:wrap}
.savebar.show{transform:none;opacity:1;pointer-events:auto}
.savebar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.savebar .btn.solid{background:var(--bg);color:var(--text);border-color:var(--bg)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:14px}
.sw{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.sw i{width:54px;height:54px;border-radius:calc(var(--radius)*.9);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);transition:.2s;outline:2px solid transparent;outline-offset:2px}
.sw:hover i{transform:translateY(-2px)}
.sw.on i{outline-color:var(--text)}
.sw.on{color:var(--text)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.opt{padding:14px;border-radius:var(--radius);border:2px solid var(--border);background:var(--bg);text-align:left;transition:.15s;display:grid;gap:4px}
.opt:hover{border-color:rgba(var(--accent-rgb),.5)}
.opt.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.06)}
.opt .aa{font-size:26px;line-height:1.1}
.opt small{color:var(--muted);font-size:12px;font-weight:600}
.mode-prev{width:100%;height:40px;border-radius:8px;border:1px solid rgba(0,0,0,.1);display:flex;gap:4px;padding:6px;margin-bottom:6px}
.mode-prev i{flex:1;border-radius:4px}
.file-row{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.file-row .res-ic{--tc:var(--accent)}
.file-row div{min-width:0;flex:1}
.file-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-prev{width:110px;height:130px;border-radius:var(--radius);overflow:hidden;flex:none}
pre.code{padding:16px;border-radius:12px;background:#0b1020;color:#cbd5e1;font-size:12.5px;overflow:auto;white-space:pre;line-height:1.55;max-height:360px;border:1px solid #1e293b}
ol.steps{display:grid;gap:8px;padding-left:20px;font-size:14.5px}
ol.steps code,p code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
.stack{display:grid;gap:18px}
.err-page{padding:40px;text-align:center;display:grid;gap:12px;justify-items:center}
.info{display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accent-rgb),.18);font-size:14px;align-items:flex-start}
.info svg{color:var(--accent);flex:none;margin-top:2px}

/* ================= RESPONSIVE ================= */
@media (max-width:1100px){.g2{grid-template-columns:1fr}.split{grid-template-columns:330px 1fr}.plinks a{padding:8px 8px;font-size:13.5px}}
@media (max-width:980px){
 .only-m{display:inline-grid!important}
 .hide-m{display:none!important}
 .brand small{display:none}
 .psearch kbd{display:none}
 .psearch input{padding-right:16px}
 .hero-in{grid-template-columns:1fr;gap:44px}
 .hero-visual{order:-1;width:min(240px,62vw)}
 .stats-row{grid-template-columns:repeat(2,1fr);margin-top:44px}
 .stat:nth-of-type(2n){border-right:0}.stat:nth-of-type(-n+2){border-bottom:1px solid var(--border)}
 .about-grid,.edu-grid{grid-template-columns:1fr}
 .cv-card{grid-template-columns:auto 1fr}.cv-act{grid-column:1/-1}
 .shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:288px;z-index:90;transform:translateX(-105%);transition:transform .3s ease;box-shadow:0 0 50px rgba(0,0,0,.3)}
 .shell.side-open .side{transform:none}
 .shell.side-open .side-backdrop{display:block;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45)}
 .tb-search{display:none}
 .split{grid-template-columns:1fr;height:auto;min-height:0}
 .split.has-sel .split-list{display:none}
 .split:not(.has-sel) .split-detail{display:none}
 .f1{left:-26px}.f2{right:-26px}
}
@media (max-width:600px){
 body{font-size:15px}
 .wrap{padding:0 16px}.content{padding:16px;gap:18px}.topbar{padding:10px 14px;gap:8px}
 .row2,.grid2{grid-template-columns:1fr}
 .sec{padding:60px 0}.hero{padding:36px 0 20px}
 .stat{padding:16px}.stat b{font-size:32px}
 .modal-bg{padding:10px;place-items:start stretch}
 .modal{border-radius:18px;max-height:calc(100vh - 20px);padding:22px 18px;animation:dropin .28s cubic-bezier(.2,.8,.2,1)}
 .modal.wide{height:100%;max-height:100%;border-radius:0}
 .float{padding:8px 11px;font-size:12px}.float .fi{width:28px;height:28px}
 .f1{left:-18px}.f2{right:-18px}
 .bar-row{grid-template-columns:86px 1fr 26px;gap:8px}
 #toasts{top:10px}
 .brand>span:not(.av){display:none}
 .brand .av{width:34px!important;height:34px!important}
 .pnav-in{gap:10px;height:62px}
 .psearch input{height:40px}
 .pnav-act{gap:6px}
 .pnav-act .icon-btn{width:38px;height:38px}
 .pl{padding:22px}.edu-col{padding:20px}.cv-card{padding:22px;gap:16px}
 .cv-ic{width:56px;height:70px}
 .welcome{padding:22px}
 .split-detail{padding:22px}
 .res-grid{grid-template-columns:1fr}
 .kpis{grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:14px;gap:10px}.kpi .ki{width:38px;height:38px}.kpi b{font-size:22px}
 .sub-list{margin-left:6px}
 .hero-cta .btn{flex:1}
 .gal{columns:2 140px;column-gap:10px}.gal figure{margin-bottom:10px}
 .cvdoc{padding:24px 20px;font-size:12.5px}.cvdoc h1{font-size:24px}
 .cv-scroll{padding:10px}
 .lb-stage{padding:10px}.lb-nav{width:40px!important;height:40px!important}
 .pnav-act .btn span{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}
@media print{.pnav,.pnav-act,.hero-cta,#toasts{display:none!important}.reveal{opacity:1;transform:none}}

function cvModel(p) {
  const c = p.cv || {};
  const li = (p.socials || []).find(s => s.label === 'LinkedIn' && s.url);
  const contact = [p.location, c.showPhone !== false && p.phone, p.email, li && li.url.replace(/^https?:\/\/(www\.)?/, '')].filter(Boolean);
  const edu = [...(p.education || [])].filter(e => e.degree);
  return {
    name: p.name || '', title: c.headline || p.title || '', contact, summary: c.summary || p.about || '',
    education: edu,
    placements: (p.placements || []).filter(x => x.school),
    skills: (p.skills || []).filter(s => s.group && (s.items || []).length),
    work: (p.work || []).filter(w => w.role),
    credentials: p.credentials || [],
    languages: c.languages || [],
    coursework: c.coursework || [],
    referees: (c.referees || []).filter(r => r.name),
    refNote: c.refNote || 'Available on request',
    accent: (c.accent || '#1e3a8a')
  };
}

function embedFor(u) {
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
  const gd = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (gd) return `https://drive.google.com/file/d/${gd[1]}/preview`;
  if (/docs\.google\.com\/(document|presentation|spreadsheets)\//.test(u)) return u.replace(/\/(edit|view)[^/]*$/, '/preview');
  if (/\.pdf(\?|#|$)/i.test(u)) return u;
  if (/\.(pptx?|docx?|xlsx?)(\?|$)/i.test(u)) return 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(u);
  if (/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)) return 'img:' + u;
  return '';
}

let lgRAF = 0;
function startLoginFx() {
  cancelAnimationFrame(lgRAF);
  const cv = $('#lgfx'); if (!cv) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, pts = [], mouse = { x: -9999, y: -9999 };

  const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(110, W * H / 12000)); pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6, r: Math.random() * 2.2 + .8, c: cols[Math.floor(Math.random() * cols.length)] })); };

  window.addEventListener('resize', onR);
  cv.parentElement.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; });
  cv.parentElement.addEventListener('pointerleave', () => { mouse = { x: -9999, y: -9999 }; });

    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      if (!reduce) { p.x += p.vx; p.y += p.vy; }
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 120 && d > 0) { p.x += dx / d * 1.4; p.y += dy / d * 1.4; }
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { ctx.strokeStyle = `rgba(199,210,254,${(1 - d / 130) * .35})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of pts) {
      const md = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (md < 180) { ctx.strokeStyle = `rgba(255,255,255,${(1 - md / 180) * .5})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }

/* ---------- form helpers ---------- */
function fld(label, path, o = {}) {
  const obj = o.target === 'sec' ? S.secDraft : o.target === 'set' ? S.setDraft : S.draft, v = getPath(obj, path);
  const t = o.target ? ` data-target="${o.target}"` : '', cls = 'fld' + (o.full ? ' full' : '');
  if (o.type === 'checkbox') return `<label class="check ${o.full ? 'full' : ''}"><input type="checkbox" data-bind="${path}"${t} ${v ? 'checked' : ''}> ${label}</label>`;
  if (o.opts) return `<label class="${cls}"><span>${label}</span><select data-bind="${path}"${t}${o.rerender ? ' data-rerender="1"' : ''}>${o.opts.map(x => { const [val, lab] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}" ${val === v ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select></label>`;
  if (o.lines) return `<label class="${cls}"><span>${label}</span><textarea rows="${o.rows || 4}" data-bind="${path}" data-lines="1"${t} placeholder="${esc(o.ph || '')}">${esc((v || []).join('\n'))}</textarea><small>One item per line</small></label>`;
  if (o.rows) return `<label class="${cls}"><span>${label}</span><textarea rows="${o.rows}" data-bind="${path}"${t} placeholder="${esc(o.ph || '')}">${esc(v)}</textarea></label>`;
  return `<label class="${cls}"><span>${label}</span><input type="${o.type || 'text'}" data-bind="${path}"${t} value="${esc(v)}" placeholder="${esc(o.ph || '')}"></label>`;
}
const tools = (path, i, len, target = '') => { const t = target ? ` data-target="${target}"` : ''; return `<button class="icon-btn sm" data-act="arr-move" data-path="${path}" data-i="${i}" data-d="-1"${t} ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up">${ic('up', 15)}</button><button class="icon-btn sm" data-act="arr-move" data-path="${path}" data-i="${i}" data-d="1"${t} ${i === len - 1 ? 'disabled' : ''} title="Move down" aria-label="Move down">${ic('down', 15)}</button><button class="icon-btn sm btn-danger" data-act="arr-del" data-path="${path}" data-i="${i}"${t} title="Remove" aria-label="Remove">${ic('trash', 15)}</button>`; };
const item = (path, i, len, title, inner) => `<div class="arr-item"><div class="arr-head"><strong>${title}</strong><div class="arr-tools">${tools(path, i, len)}</div></div><div class="grid2">${inner}</div></div>`;
const addBtn = (path, tpl, label) => `<button class="btn" data-act="arr-add" data-path="${path}" data-tpl="${tpl}">${ic('plus', 16)} ${label}</button>`;
const fileRow = (name, size, viewAct, rmAct, extra = '') => `<div class="file-row"><span class="res-ic">${ic('filetext', 20)}</span><div><b>${esc(name)}</b><small class="muted">${size || 'Uploaded'}</small></div><button class="btn btn-sm" data-act="${viewAct}" ${extra}>${ic('eye', 15)} View</button><button class="btn btn-sm btn-danger" data-act="${rmAct}" ${extra}>${ic('trash', 15)} Remove</button></div>`;
const dropzone = (kind, label, accept, i = '', multi = false) => `<label class="drop">${ic(kind === 'gallery' ? 'camera' : 'upload', 26)}<span>${label}</span><small>Click or drop ${multi ? 'files' : 'a file'} · up to ${fmtSize(MAX_FILE)} each</small><input type="file" data-upload="${kind}" ${i !== '' ? `data-i="${i}"` : ''} accept="${accept}" ${multi ? 'multiple' : ''}></label>`;
const savebar = () => `<div class="savebar ${S.dirty ? 'show' : ''}" id="savebar"><span>You have unsaved changes</span><div style="display:flex;gap:8px"><button class="btn btn-sm" data-act="discard">Discard</button><button class="btn btn-sm solid" data-act="save-profile">${ic('check', 15)} Save changes</button></div></div>`;

/* ---- safe HTML: only formatting survives (used on save, paste, import and public display) ---- */
const W_TAGS = new Set('P DIV BR B STRONG I EM U S STRIKE DEL SUB SUP SPAN H1 H2 H3 H4 BLOCKQUOTE PRE CODE UL OL LI TABLE THEAD TBODY TR TD TH A IMG HR COLGROUP COL MARK'.split(' '));
const W_CSS = ['color', 'background-color', 'font-size', 'font-family', 'font-weight', 'font-style', 'text-decoration', 'text-align', 'line-height', 'margin-left', 'padding-left', 'width', 'vertical-align', 'list-style-type', 'text-indent', 'float', 'margin'];
function cleanHTML(html) {
  const doc = new DOMParser().parseFromString(`<body>${html || ''}</body>`, 'text/html');
  const attrs = el => {
    [...el.attributes].forEach(a => {
      const n = a.name.toLowerCase(), v = a.value;
      if (n === 'style') {
        const keep = W_CSS.map(p => [p, el.style.getPropertyValue(p)]).filter(([, x]) => x && !/url\(|expression|javascript/i.test(x));
        el.removeAttribute('style'); keep.forEach(([p, x]) => el.style.setProperty(p, x));
        if (!el.getAttribute('style')) el.removeAttribute('style'); return;
      }
      if (n === 'href' && el.tagName === 'A' && /^(https?:|mailto:|tel:|#)/i.test(v.trim())) { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener'); return; }
      if (n === 'src' && el.tagName === 'IMG' && /^(data:image\/(png|jpe?g|gif|webp);|https:)/i.test(v.trim())) return;
      if (['colspan', 'rowspan', 'target', 'rel', 'alt'].includes(n)) return;
      if (n === 'class' && /^(wr-pb|wt|wq|wr-chk|fr|fn|fd|wsh|wsblk|wsub|wteacher|wline|wtitle|wmeta|wsec|qn|wans|wwork)$/.test(v)) return;
      if (n === 'data-mv' && el.tagName === 'IMG' && v.length < 6000) { try { JSON.parse(v); return; } catch { } }
      if (n === 'type' && /^(OL)$/.test(el.tagName) && /^[aAiI1]$/.test(v)) return;
      if (n === 'start' && el.tagName === 'OL' && /^\d+$/.test(v)) return;
      el.removeAttribute(a.name);
    });
  };
  const walk = el => [...el.children].forEach(c => {
    if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|META|LINK|TITLE|svg|math|FORM|INPUT|BUTTON|TEXTAREA|SELECT)$/i.test(c.tagName)) return c.remove();
    if (c.tagName === 'FONT') { const s = doc.createElement('span'); if (c.getAttribute('color')) s.style.color = c.getAttribute('color'); if (c.getAttribute('face')) s.style.fontFamily = c.getAttribute('face'); s.append(...c.childNodes); c.replaceWith(s); walk(s); attrs(s); return; }
    walk(c);
    if (!W_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); return; }
    attrs(c);
  });
  walk(doc.body);
  doc.body.querySelectorAll('span:not([style]):not([class])').forEach(s => s.replaceWith(...s.childNodes));
  return doc.body.innerHTML.replace(/<!--[\s\S]*?-->/g, '').replace(/\u200B/g, '');
}
